name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run Linter
        # run: echo "::error::À compléter - remplacez cette ligne par la commande qui lance ruff" && exit 1
        run: uv run ruff check formation_mlops_2
      - name: Run tests
        run: uv run pytest tests/test_unit
        # run: echo "::error::À compléter - remplacez cette ligne par la commande qui lance les tests unitaires" && exit 1
      - name: Run vulture
        run: uv run vulture formation_mlops_2
      - name: Run bandit
        run: uv run bandit formation_mlops_2
      - name: Run detect secrets
        run: uv run detect-secrets scan

